# Generated from src/lib/content/contract.ts. Run `bun run cms:config` instead of editing.
backend:
  name: github
  repo: mgkdante/vitreva
  branch: main
  base_url: https://login.yesid.dev
  auth_endpoint: auth/popup
  api_root: https://login.yesid.dev/vitreva
  graphql_api_root: https://login.yesid.dev/vitreva
media_folder: static/images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
i18n:
  structure: multiple_files
  locales:
    - fr
    - en
    - es
  default_locale: fr
collections:
  - name: pages
    label: Pages
    icon: web
    format: json
    i18n: true
    files:
      - name: home
        label: Accueil
        file: "src/lib/content/home.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: hero
            label: Haut de page
            i18n: true
            widget: object
            collapsed: false
            fields:
              - name: lines
                label: "Grand titre, une ligne par entrée"
                widget: list
                i18n: true
                collapsed: true
                min: 2
                max: 2
                allow_add: false
                allow_remove: false
                allow_reorder: false
                field:
                  name: value
                  label: Ligne
                  i18n: true
                  widget: string
              - name: subtitle
