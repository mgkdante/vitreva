            required: false
            accept: "image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif"
          - name: installation
            label: Installation
            i18n: duplicate
            hint: Dans la section Le service de l’accueil et sur la page Remplacement. Revoyez sa description dans Accueil. Laissez vide pour garder la photo actuelle.
            widget: image
            required: false
            accept: "image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif"
          - name: aftercare
            label: Après la pose
            i18n: duplicate
            hint: "Dans la zone desservie de l’accueil et sur les pages Assurance, Caméras et Zone desservie. Laissez vide pour garder la photo actuelle."
