            required: false
            accept: "image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif"
          - name: quote
            label: Fond du formulaire
            i18n: duplicate
            hint: Floue derrière le formulaire de soumission. Laissez vide pour garder la photo actuelle.
            widget: image
            required: false
